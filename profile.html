<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي | Travel Touch</title><script src="https://cdn.tailwindcss.com/3.4.17"></script><style>body{background:#071426;color:#e5eefb;font-family:system-ui,sans-serif}.panel{background:#10243b;border:1px solid #25415f;border-radius:20px}</style><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/tt-design.css">
</head><body class="min-h-screen p-5"><main class="max-w-2xl mx-auto"><a href="index.html" class="text-sky-300">← الرئيسية</a><section class="panel p-6 mt-6"><h1 class="text-2xl font-black">حسابي</h1><div id="details" class="my-5 text-slate-300">جارٍ التحميل…</div><div class="flex flex-wrap gap-3"><a href="ticketWallet.html" class="bg-sky-600 rounded-xl px-4 py-3 font-bold">محفظة التذاكر</a><button id="out" class="border border-slate-600 rounded-xl px-4 py-3">تسجيل الخروج</button><button id="delete-account" class="border border-red-500/50 text-red-300 rounded-xl px-4 py-3">حذف الحساب نهائياً</button></div></section></main><script type="module">import{TT}from"./tt-backend.js";try{const{user,isAdmin}=await TT.whenReady();if(!user)TT.requireLogin();else document.getElementById("details").innerHTML=`<p><b>${TT.esc(user.displayName||"مستخدم Travel Touch")}</b></p><p dir="ltr">${TT.esc(user.email||"")}</p>${isAdmin?'<p class="text-emerald-300 mt-2">حساب مشرف</p>':""}`}catch(e){document.getElementById("details").textContent=e.message}document.getElementById("out").onclick=async()=>{await TT.signOut();location.href="index.html"};document.getElementById("delete-account").onclick=async()=>{if(!(await TT.confirm("سيُحذف حساب الدخول والبيانات الشخصية نهائياً. ستُحذف التذاكر والمحادثات، وستُزال بيانات المسافر من سجلات الحجوزات والمدفوعات التي نحتفظ بها محاسبياً. لا يمكن التراجع. هل تريد المتابعة؟",{title:"حذف الحساب نهائياً",confirmLabel:"متابعة الحذف",danger:true})))return;if(!(await TT.confirm("تأكيد أخير: هل تريد حذف حسابك الآن؟ يجب أن تكون قد سجلت الدخول خلال آخر 5 دقائق.",{title:"تأكيد أخير",confirmLabel:"حذف الحساب",danger:true})))return;const b=document.getElementById("delete-account");b.disabled=true;b.textContent="جارٍ حذف الحساب…";try{await TT.deleteMyAccount();location.href="index.html?account_deleted=1"}catch(e){TT.notify(e.message||"تعذر حذف الحساب. حاول مجدداً.","error");b.disabled=false;b.textContent="حذف الحساب نهائياً"}};</script><script>if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/sw.js").catch(()=>{});</script></body></html>
