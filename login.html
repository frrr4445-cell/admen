<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | Travel Touch</title><script src="https://cdn.tailwindcss.com/3.4.17"></script><style>body{background:#071426;color:#e5eefb;font-family:system-ui,sans-serif}.panel{background:#10243b;border:1px solid #25415f;border-radius:22px}</style><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/tt-design.css">
</head>
<body class="min-h-screen grid place-items-center p-4"><main class="panel w-full max-w-md p-7"><a href="index.html" class="text-sky-300">← الرئيسية</a><h1 class="text-2xl font-black mt-5">مرحباً بعودتك</h1><p class="text-slate-400 mt-2 mb-6">سجّل الدخول لمتابعة حجوزاتك.</p>
<form id="form" class="space-y-4"><label class="block">البريد الإلكتروني<input id="email" type="email" required autocomplete="email" class="mt-2 w-full rounded-xl bg-slate-900 border border-slate-700 p-3"></label><label class="block">كلمة المرور<input id="password" type="password" required autocomplete="current-password" class="mt-2 w-full rounded-xl bg-slate-900 border border-slate-700 p-3"></label><button class="w-full bg-sky-600 rounded-xl p-3 font-bold">تسجيل الدخول</button></form>
<button id="google" class="w-full border border-slate-600 rounded-xl p-3 mt-3">المتابعة باستخدام Google</button><button id="reset" class="text-sky-300 text-sm mt-4">نسيت كلمة المرور؟</button><p id="msg" role="status" class="mt-4 text-sm text-amber-300"></p><p class="text-sm text-slate-400 mt-5">ليس لديك حساب؟ <a href="register.html" class="text-sky-300">أنشئ حساباً</a></p></main>
<script type="module">import{TT}from"./tt-backend.js";const $=id=>document.getElementById(id);$("form").addEventListener("submit",async e=>{e.preventDefault();$("msg").textContent="جارٍ تسجيل الدخول…";try{await TT.signIn($("email").value,$("password").value);const next=new URLSearchParams(location.search).get("next")||"profile.html";location.href=/^(index|checkout|profile|ticketWallet|dashboard|payment-success)\.html(?:\?[A-Za-z0-9_=&%-]*)?$/.test(next)?next:"profile.html"}catch(x){$("msg").textContent=x.message}});$("google").onclick=async()=>{try{await TT.signInGoogle();location.href="profile.html"}catch(x){$("msg").textContent=x.message}};$("reset").onclick=async()=>{try{await TT.resetPassword($("email").value);$("msg").textContent="أرسلنا رابط إعادة تعيين كلمة المرور إن كان البريد مسجلاً."}catch(x){$("msg").textContent=x.message}};</script><script>if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/sw.js").catch(()=>{});</script></body></html>
