<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب | Travel Touch</title><script src="https://cdn.tailwindcss.com/3.4.17"></script><style>body{background:#071426;color:#e5eefb;font-family:system-ui,sans-serif}.panel{background:#10243b;border:1px solid #25415f;border-radius:22px}</style><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/tt-design.css">
</head><body class="min-h-screen grid place-items-center p-4"><main class="panel w-full max-w-md p-7"><a href="index.html" class="text-sky-300">← الرئيسية</a><h1 class="text-2xl font-black mt-5">أنشئ حسابك</h1><form id="f" class="space-y-4 mt-6"><label class="block">الاسم الكامل<input id="name" required minlength="2" class="mt-2 w-full rounded-xl bg-slate-900 border border-slate-700 p-3"></label><label class="block">البريد الإلكتروني<input id="email" type="email" required class="mt-2 w-full rounded-xl bg-slate-900 border border-slate-700 p-3"></label><label class="block">كلمة المرور<input id="pass" type="password" minlength="8" required class="mt-2 w-full rounded-xl bg-slate-900 border border-slate-700 p-3"></label><button class="w-full bg-sky-600 rounded-xl p-3 font-bold">إنشاء الحساب</button></form><p id="msg" class="mt-4 text-amber-300 text-sm"></p></main><script type="module">import{TT}from"./tt-backend.js";document.getElementById("f").onsubmit=async e=>{e.preventDefault();const $=id=>document.getElementById(id);try{await TT.register({displayName:$("name").value,email:$("email").value,password:$("pass").value});location.href="profile.html"}catch(x){$("msg").textContent=x.message}};</script><script>if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/sw.js").catch(()=>{});</script></body></html>
