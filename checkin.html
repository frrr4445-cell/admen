<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص التذاكر | Travel Touch</title><script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{background:#071426;color:#e5eefb;font-family:system-ui,sans-serif}.panel{background:#10243b;border:1px solid #25415f;border-radius:18px}</style><link rel="stylesheet" href="/assets/tt-design.css">
</head><body class="min-h-screen p-5"><main class="max-w-xl mx-auto"><a href="dashboard.html" class="text-sky-300">← لوحة المشرف</a><section class="panel p-5 mt-5"><h1 class="text-2xl font-black">فحص التذاكر وتسجيل الوصول</h1><p class="text-slate-400 text-sm mt-2">هذه الصفحة للمشرفين المخولين فقط. يتطلب تشغيل الكاميرا HTTPS وإذن المستخدم.</p><div id="reader" class="mt-5"></div><label class="block mt-5 text-sm">أو أدخل الرمز يدوياً</label><textarea id="token" class="w-full mt-2 p-3 rounded-xl bg-slate-900 border border-slate-700" rows="3"></textarea><button id="verify" class="mt-3 bg-sky-600 px-5 py-3 rounded-xl font-bold">تحقق وسجّل الوصول</button><p id="result" class="mt-4 text-sm" aria-live="polite"></p></section></main><script type="module">import{TT}from"./tt-backend.js";const $=id=>document.getElementById(id);let busy=false;async function verify(value){if(busy||!value)return;busy=true;$('verify').disabled=true;$('result').textContent='جارٍ التحقق…';try{const r=await TT.checkInTicket(value);$('result').textContent=`تم تسجيل الوصول بنجاح للحجز ${r.bookingId} — ${r.provider}`;$('result').className='mt-4 text-sm text-emerald-300';$('token').value='';}catch(e){$('result').textContent=e.message||'تعذر التحقق من التذكرة.';$('result').className='mt-4 text-sm text-rose-300';}finally{busy=false;$('verify').disabled=false;}}$('verify').onclick=()=>verify($('token').value.trim());try{const{user,isAdmin}=await TT.whenReady();if(!user||!isAdmin)throw new Error('هذه الصفحة متاحة للمشرفين المخولين فقط.');if(window.Html5Qrcode){const scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:8,qrbox:{width:240,height:240}},async decoded=>{await scanner.stop().catch(()=>{});$('token').value=decoded;await verify(decoded);},()=>{});}else $('result').textContent='تعذر تحميل قارئ QR. يمكنك إدخال الرمز يدوياً.';}catch(e){$('result').textContent=e.message||'تعذر التحقق من الصلاحيات.';}</script></body></html>
